name: GitHub Pages

# deploy หน้าเว็บ (โฟลเดอร์ public) ขึ้น GitHub Pages โดยคุยกับ Supabase
# ต้องตั้ง Repository variables: SUPABASE_URL และ SUPABASE_ANON_KEY (ยังไม่ตั้ง = ข้ามขั้นตอนนี้)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ vars.SUPABASE_URL != '' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: สร้าง config.js จาก Repository variables
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          node -e "require('fs').writeFileSync('public/config.js', 'window.APP_CONFIG = ' + JSON.stringify({ supabaseUrl: process.env.SUPABASE_URL, supabaseAnonKey: process.env.SUPABASE_ANON_KEY }) + ';\n')"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
