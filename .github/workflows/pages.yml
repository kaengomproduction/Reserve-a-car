name: GitHub Pages

# deploy หน้าเว็บ (โฟลเดอร์ public) ขึ้น GitHub Pages โดยคุยกับ Supabase
# ต้องตั้งค่า SUPABASE_URL และ SUPABASE_ANON_KEY ไว้ที่ใดที่หนึ่ง: Repository variables, Repository secrets
# หรือ Environment "github-pages" (ไม่พบ = workflow ล้มเหลวพร้อมบอกวิธีตั้งค่า)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: สร้าง config.js จากค่า Supabase
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
        run: node scripts/make-config.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
